<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Комната — обмен сообщениями</title>
<link rel="stylesheet" href="style.css">
<script defer src="app.js"></script>
</head>
<body>
<main>
<header><span class="brand">Комната</span><span class="badge">Локальный режим</span></header>
<section id="welcome">
  <h1>Анонимный обмен<br>сообщениями</h1>
  <p>Создайте комнату или введите её код в другой вкладке этого же браузера.</p>
  <button id="create">Создать комнату</button>
  <form id="join">
    <label for="code">Код комнаты</label>
    <div class="row"><input id="code" required maxlength="8" autocomplete="off" placeholder="Например, A12B34CD"><button class="secondary">Войти</button></div>
  </form>
</section>
<section id="chat" hidden>
  <div class="chat-head"><div><h1>Комната <span id="room"></span></h1><p id="identity"></p></div><button class="secondary" id="leave">Выйти</button></div>
  <div id="history" role="log" aria-label="История сообщений"></div>
  <form id="send">
    <label for="message">Сообщение</label>
    <textarea id="message" rows="3" maxlength="1000" required placeholder="Напишите сообщение"></textarea>
    <div class="row actions"><span>До 1000 символов</span><button>Отправить</button></div>
  </form>
</section>
<p id="status" role="status"></p>
</main>
</body>
</html>
